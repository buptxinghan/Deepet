<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桌宠与状态 · Deepet</title><style>
:root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#293f5c;background:#f0f4fa}*{box-sizing:border-box}body{max-width:650px;padding:24px 18px;margin:auto}h1{font-size:24px;margin:14px 0}h2{font-size:16px}p{font-size:13px;line-height:1.8;color:#74869c}.card{background:#fff;padding:20px;border:1px solid #dfe8f3;border-radius:14px;margin:18px 0}label{font-size:13px;display:block;margin:15px 0 8px}input,select,button{font:inherit;border-radius:8px;border:1px solid #dbe4ef;padding:10px 12px;background:#f4f7fb;color:#365676;max-width:100%}input:not([type=checkbox]),select{width:100%}button{cursor:pointer;margin:8px 5px 0 0;font-size:13px}.primary{background:#527cba;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap}.check{display:flex;gap:6px;align-items:center}a{color:#527cba}#feedback{min-height:25px}#status{background:#eaf1fa;padding:12px;border-radius:8px}@media(prefers-color-scheme:dark){:root{color:#d9e6f5;background:#142033}.card{background:#1d2d44;border-color:#34465d}input,select,button{background:#263b56;color:#d9e6f5;border-color:#34465d}#status{background:#263b56}}
</style></head><body><a href="/">← 设备管理</a><h1>桌宠与状态</h1><p>屏幕没有触摸功能；日常自动陪伴，主动互动在这里操作。</p><p id="status">正在读取时钟状态…</p><section class="card"><h2>显示来源</h2><label for="source">看哪里</label><select id="source"><option value="mac">我的 Mac</option><option value="rotate">自动轮播</option><option value="servers">双服务器同屏</option></select><p>固定左右各一台，按 Mac 配套程序中保存的勾选顺序显示前两台。每台显示 GPU 占用、内存占用和已用显存（G），标识在上、数值在下，离线时保留位置。</p><label for="rotation">轮播间隔</label><select id="rotation"><option value="10">10 秒</option><option value="15" selected>15 秒</option><option value="30">30 秒</option><option value="60">60 秒</option></select><button class="primary" id="save">保存显示设置</button></section><section class="card"><h2>隔空打个招呼</h2><div class="row"><button data-action="greet">打招呼</button><button data-action="tickle">挠痒痒</button><button data-action="praise">鼓励一下</button></div><p>短暂回应后回到原状态，重要提醒优先。</p></section><section class="card"><h2>留一句话</h2><label for="note">留言（最多28个字）</label><input id="note" placeholder="今天也记得喝水呀。"><label class="check"><input id="pinned" type="checkbox" checked>一直显示</label><button class="primary" id="send">显示留言</button><button id="clear">收起留言</button></section><p id="feedback" role="status"></p><p>状态由 Mac 汇总后通过局域网推送。Mac 离线时，本地时钟和动作继续，远程指标标记过期。</p><script src="/js/utils.js"></script><script src="/js/companion.js"></script></body></html>
