; Baseline firmware, pinned dependencies and native Apple Silicon host tools.
; Use tools/build_baseline.py; no upload target is used by that script.

[env:esp12e]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
monitor_filters = esp8266_exception_decoder, time, colorize
build_flags =
    -Iinclude
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
extra_scripts = pre:scripts/git_version.py
platform_packages =
    toolchain-xtensa @ file://${sysenv.DESKTOP_CLOCK_BUILD_CACHE}/native-toolchain
    tool-mklittlefs @ file://${sysenv.DESKTOP_CLOCK_BUILD_CACHE}/native-mklittlefs
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    moononournation/GFX Library for Arduino@1.6.9
    bitbank2/AnimatedGIF@2.2.3
